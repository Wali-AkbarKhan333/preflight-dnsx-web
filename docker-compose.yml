services:
  mx-preflight:
    build:
      context: .
      args:
        DNSX_VERSION: "1.3.1"
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DNSX_PATH: "/app/tools/dnsx"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_DAYS: "${SESSION_DAYS:-14}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      RESULT_FILE_RETENTION_HOURS: "${RESULT_FILE_RETENTION_HOURS:-720}"
      DEFAULT_THREADS: "${DEFAULT_THREADS:-100}"
      DEFAULT_RATE_LIMIT: "${DEFAULT_RATE_LIMIT:-1000}"
      MAX_THREADS: "${MAX_THREADS:-300}"
      MAX_RATE_LIMIT: "${MAX_RATE_LIMIT:-5000}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
