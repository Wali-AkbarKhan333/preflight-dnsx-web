services:
  mx-preflight:
    build:
      context: .
      args:
        DNSX_VERSION: "1.3.1"
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DNSX_PATH: "/app/tools/dnsx"
      APP_USERNAME: "${APP_USERNAME:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      JOB_RETENTION_HOURS: "${JOB_RETENTION_HOURS:-24}"
      DEFAULT_THREADS: "${DEFAULT_THREADS:-100}"
      DEFAULT_RATE_LIMIT: "${DEFAULT_RATE_LIMIT:-1000}"
      MAX_THREADS: "${MAX_THREADS:-300}"
      MAX_RATE_LIMIT: "${MAX_RATE_LIMIT:-5000}"
    volumes:
      - ./data/jobs:/app/data/jobs
    restart: unless-stopped
